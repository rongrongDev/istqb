<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Exam Room Blueprint</title>
<!--
  Starter for the stage-2 blueprint page. Copy it next to the stage-1 page
  (e.g. design/<slug>-blueprint.html) and replace the "BLUEPRINT DATA" block
  in the script: page text, the chosen palette(s), global switches, the
  decision ledger, mockups and one SECTIONS entry per section.

  Section bodies are built from the helpers in the shell: pair (desktop +
  phone per theme), desk (desktop only), options (A/B/C cards with a
  recommendation), local (a switch inside a section), note, rules, answer,
  ledger, table, flow, paletteCards and tokenTable.

  Keep window.DESIGN / window.setDesignState; ../design-directions/scripts/
  render.cjs uses them to screenshot every section. Mark decorative elements
  that deliberately bleed past a frame edge with data-bleed.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=Geist+Mono:wght@400;500&family=Figtree:wght@400;500;600;700;800&family=Literata:opsz,wght@7..72,400;7..72,600&family=IBM+Plex+Mono:wght@400;500;600&family=Atkinson+Hyperlegible:wght@400;700&family=JetBrains+Mono:wght@400;600&family=Lexend:wght@400;500;600;700&family=Spline+Sans+Mono:wght@400;600&display=swap">
<style>
/* Page: section index, sticky control bar (palette · theme · device · global switches), then one section per area: question and answer boxes, mockups, notes. */
:root {
  --bg: #f3f4f6; --card: #ffffff; --fg: #14161b; --muted: #5c6270; --line: #dde0e6;
  --accent: #2f4fd1; --accent-soft: #e6ebfc; --ok-ink: #2c9a5d; --q-ink: #b7791f;
  --font-body: 'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif;
  --font-mono: 'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d0e11; --card: #15171c; --fg: #e8e9ed; --muted: #969bab; --line: #2a2d35;
    --accent: #8ea4ff; --accent-soft: #1f2540; --ok-ink: #4cc38a; --q-ink: #e6a94e; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d0e11; --card: #15171c; --fg: #e8e9ed; --muted: #969bab; --line: #2a2d35;
  --accent: #8ea4ff; --accent-soft: #1f2540; --ok-ink: #4cc38a; --q-ink: #e6a94e; color-scheme: dark;
}
html, body { background: var(--bg); color: var(--fg); }
body { margin: 0; font-family: var(--font-body); font-size: 15px; line-height: 1.55; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.wrap { max-width: 1240px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.eyebrow { font-family: var(--font-mono); font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
h1 { font-size: clamp(28px, 4vw, 40px); line-height: 1.12; letter-spacing: -.02em; margin: 6px 0 10px; text-wrap: balance; }
h2 { font-size: 22px; letter-spacing: -.01em; margin: 0 0 12px; text-wrap: balance; }
h3 { font-size: 16px; margin: 0 0 8px; }
p { margin: 0 0 10px; }
a { color: var(--accent); }
.lede { color: var(--muted); max-width: 72ch; font-size: 16px; }
header.top { padding-block: 40px 20px; }
nav.toc { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 13.5px; margin-top: 14px; }
nav.toc a { color: var(--muted); text-decoration: none; border-bottom: 1px dotted var(--line); }
nav.toc a:hover { color: var(--accent); }

.controls { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
.controls .wrap { display: flex; flex-wrap: wrap; gap: 10px 20px; padding-block: 10px; align-items: center; }
.ctl, .local { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.ctl > span, .local > span { font-family: var(--font-mono); font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.local { margin: 0 0 12px; }
.segc { display: inline-flex; flex-wrap: wrap; border: 1px solid var(--line); border-radius: 8px; background: var(--card); padding: 2px; gap: 2px; }
.segc button { font: inherit; font-size: 13.5px; font-weight: 500; border: 0; background: transparent; color: var(--muted); padding: 5px 10px; border-radius: 6px; cursor: pointer; }
.segc button:hover { color: var(--fg); }
.segc button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

section.sec { padding-block: 44px 8px; border-top: 1px solid var(--line); margin-top: 28px; scroll-margin-top: 120px; }
section.sec:first-child { border-top: 0; margin-top: 0; }
.sec-h { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 24px; align-items: start; margin-bottom: 18px; }
.sec-h h2 { font-size: 26px; margin: 2px 0 8px; }
.sec-h p { color: var(--muted); max-width: 66ch; }
.answer { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; font-size: 14px; }
.answer b.q { display: block; font-family: var(--font-mono); font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 500; margin-bottom: 4px; }
.answer + .answer { margin-top: 10px; }
.answer ul { margin: 6px 0 0; padding-left: 18px; }
.answer li { margin: 3px 0; }
.rec-tag { display: inline-block; font-family: var(--font-mono); font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--accent); background: var(--accent-soft); border-radius: 5px; padding: 1px 7px; margin-right: 6px; }
.st-ok { color: var(--ok-ink); font-weight: 600; }
.st-q { color: var(--q-ink); font-weight: 600; }
code.c { font-family: var(--font-mono); font-size: .88em; background: var(--accent-soft); color: var(--fg); padding: 0 5px; border-radius: 4px; white-space: nowrap; }

.frames { display: grid; gap: 16px; }
.fcap { font-family: var(--font-mono); font-size: 11.5px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; margin-bottom: 6px; display: flex; justify-content: space-between; gap: 8px; }
.frame { position: relative; overflow: hidden; border-radius: 10px; border: 1px solid var(--line); background: var(--card); }
.frame.ph { border: 0; background: transparent; border-radius: 38px; }
.drow { display: grid; gap: 16px; align-items: start; }
.drow.both { grid-template-columns: minmax(0, 3.3fr) minmax(0, 1fr); }
.drow + .drow { margin-top: 18px; }
.phones { display: flex; flex-wrap: wrap; gap: 20px; }
.phones > div { width: min(290px, 100%); }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 16px; min-width: 0; }
.card.chosen { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
.small { font-size: 13.5px; color: var(--muted); }
.notes { display: grid; grid-template-columns: minmax(0, 1fr); gap: 12px; margin: 14px 0 0; }
.note { font-size: 14px; background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; margin: 0; }
.note b { display: block; font-size: 12px; font-family: var(--font-mono); text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 500; margin-bottom: 4px; }
.opt3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; margin-bottom: 18px; }
.opt3 .card h3 { margin-bottom: 4px; }
.opt3 .card .small { margin: 0 0 8px; }
.cols2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
.flow { display: grid; grid-template-columns: repeat(var(--n, 5), minmax(0, 1fr)); gap: 10px; align-items: stretch; margin: 6px 0 16px; }
.flow > div { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 12px; font-size: 13px; position: relative; }
.flow > div b { display: block; margin-bottom: 4px; }
.flow > div span { color: var(--muted); font-size: 12.5px; }
.flow > div:not(:last-child)::after { content: "→"; position: absolute; right: -10px; top: 50%; transform: translate(50%, -50%); color: var(--muted); font-size: 16px; z-index: 1; }
.flow > div.hl { border-color: var(--accent); }
.palgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 16px; margin-bottom: 18px; }
.palcard { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.palcard.on { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
.palcard .top { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.palcard h3 { margin: 0; font-size: 18px; }
.palcard .chips { display: flex; gap: 4px; }
.palcard .chips i { width: 22px; height: 22px; border-radius: 6px; border: 1px solid var(--line); display: block; }
.linkbtn { font: inherit; font-size: 13px; border: 1px solid var(--line); background: var(--card); color: var(--accent); border-radius: 6px; padding: 3px 10px; cursor: pointer; white-space: nowrap; align-self: flex-start; }
.swatch { display: inline-block; width: 14px; height: 14px; border-radius: 4px; border: 1px solid var(--line); vertical-align: -2px; margin-right: 6px; }

.tablewrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 10px; background: var(--card); }
table { border-collapse: collapse; width: 100%; min-width: 760px; font-size: 13.5px; }
th, td { text-align: left; vertical-align: top; padding: 11px 14px; border-top: 1px solid var(--line); }
thead th { border-top: 0; font-family: var(--font-mono); font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 500; }
tbody th { font-size: 15px; white-space: nowrap; }
footer { padding-block: 32px 48px; color: var(--muted); font-size: 13.5px; }

@media (max-width: 900px) { .sec-h, .opt3, .cols2 { grid-template-columns: 1fr; } .flow { grid-template-columns: 1fr; } .flow > div::after { display: none; } }
@media (max-width: 700px) { .drow.both { grid-template-columns: minmax(0, 1fr); } .drow.both > div:last-child { max-width: 290px; } }

/* ───────── Mockups. Palette tokens come from generated .p-<palette>.t-<theme> rules ───────── */
.mock { position: absolute; top: 0; left: 0; transform-origin: 0 0; font-family: var(--font-ui); font-size: var(--fs); line-height: 1.4; color: var(--text); background: var(--backdrop); overflow: hidden; -webkit-font-smoothing: antialiased; text-align: left; }
.mock * { box-sizing: border-box; }
.mock svg, .mock i[data-lucide] { width: var(--ic, 16px); height: var(--ic, 16px); flex: none; stroke-width: 1.75; display: inline-block; }
.mock h1, .mock h2, .mock h3, .mock p { margin: 0; }
.mock h2 { font-size: 22px; letter-spacing: -.015em; }
.mock .mu { color: var(--muted); }
.mock .ok { color: var(--ok); }
.ib { width: 30px; height: 30px; display: grid; place-items: center; background: transparent; color: var(--muted); border-radius: var(--r-sm); flex: none; }
.ib.on { background: var(--accent-soft); color: var(--accent); }
.btn { display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 12px; border-radius: var(--r-sm); border: 1px solid var(--line); background: var(--surface); color: var(--text); font-size: 12.5px; font-weight: 600; white-space: nowrap; --ic: 14px; }
.btn.pri { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
.lbl { font-size: 11px; font-weight: 650; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); }
.inp { height: 34px; display: flex; align-items: center; gap: 8px; padding: 0 12px; border: 1px solid var(--line); border-radius: var(--r-sm); background: var(--surface); color: var(--muted); min-width: 0; --ic: 15px; }
.inp.filled { color: var(--text); }
.chip { display: inline-flex; align-items: center; gap: 5px; height: 22px; padding: 0 8px; border-radius: 99px; font-size: 11.5px; background: var(--chip); color: var(--muted); border: 1px solid var(--line); white-space: nowrap; --ic: 12px; }
.chip.acc { background: var(--accent-soft); color: var(--accent); border-color: transparent; }
.chip.ok { color: var(--ok); }
.chip.warn { color: var(--warn); }
.meter { display: block; height: 5px; border-radius: 99px; background: var(--line); overflow: hidden; }
.meter > span { display: block; height: 100%; background: var(--accent); border-radius: inherit; }
.avatar { width: 28px; height: 28px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); font-size: 11px; font-weight: 700; display: grid; place-items: center; flex: none; }
.avatar.sm { width: 22px; height: 22px; font-size: 9.5px; }
.avs { display: flex; }
.avs .avatar { border: 2px solid var(--surface); margin-left: -6px; }
.avs .avatar:first-child { margin-left: 0; }
kbd.k { font-family: var(--font-mono); font-size: 11px; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 5px; padding: 0 5px; color: var(--muted); background: var(--surface); white-space: nowrap; }
.logo { width: 24px; height: 24px; border-radius: var(--r-sm); background: var(--accent); color: var(--accent-fg); display: grid; place-items: center; font-weight: 800; font-size: 12.5px; flex: none; }
.logo.lg { width: 38px; height: 38px; font-size: 18px; border-radius: var(--r); }
.wm { font-weight: 750; font-size: 17px; letter-spacing: -.015em; }
.dot { width: 10px; height: 10px; border-radius: 3px; background: var(--h); flex: none; }
.crow { display: flex; align-items: center; gap: 8px; min-width: 0; }
.crow .meter { flex: 1; max-width: 220px; }
/* lists, tables, cards */
.nv { display: flex; align-items: center; gap: 10px; height: 34px; padding: 0 10px; border-radius: var(--r); font-weight: 550; white-space: nowrap; --ic: 16px; }
.nv svg { color: var(--muted); }
.nv.on { background: var(--sel); color: var(--sel-fg); font-weight: 650; }
.nv.on svg { color: currentColor; }
.nv .n { margin-left: auto; font-size: 11.5px; color: var(--muted); font-weight: 500; }
.nv-h { margin: 14px 10px 4px; }
.tbl { border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; background: var(--surface); }
.trow { display: grid; grid-template-columns: minmax(0, 2fr) .8fr 1fr .6fr 1.1fr .9fr; gap: 12px; align-items: center; padding: 10px 14px; font-size: 12.5px; }
.trow + .trow { border-top: 1px solid var(--line); }
.trow.th { background: var(--surface-2); font-family: var(--font-mono); font-size: 10.5px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.trow.sel { background: var(--sel); color: var(--sel-fg); }
.trow.sel .mu, .trow.sel .num { color: inherit; opacity: .75; }
.trow.sel .meter { background: color-mix(in srgb, currentColor 22%, transparent); }
.trow.sel .meter > span { background: currentColor; }
.trow .nm { display: flex; align-items: center; gap: 10px; font-weight: 650; font-size: 13px; min-width: 0; }
.trow .num { font-family: var(--font-mono); color: var(--muted); }
.cgrid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
.ccard { border: 1px solid var(--line); border-radius: var(--r-lg); background: var(--surface); overflow: hidden; box-shadow: var(--shadow); }
.ccard.sel { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
.ccard .cov { height: 92px; background: linear-gradient(135deg, var(--h), color-mix(in oklab, var(--h) 45%, var(--surface))); }
.ccard .cap { padding: 12px 14px; display: flex; flex-direction: column; gap: 9px; }
.ccard .cap b { font-size: 14px; }
.ccard .crow { font-size: 12px; color: var(--muted); }
.cgrid.m2 { grid-template-columns: 1fr 1fr; gap: 10px; padding: 12px; }
.m2 .ccard .cov { height: 54px; }
.m2 .ccard .cap { padding: 9px 10px; gap: 6px; }
.m2 .ccard .cap b { font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.m2 .ccard .crow > span:not(.chip) { display: none; }
.tasks { border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); }
.task { display: flex; align-items: center; gap: 10px; padding: 10px 14px; font-size: 13px; }
.task + .task { border-top: 1px solid var(--line); }
.task.done span { color: var(--muted); text-decoration: line-through; }
.task svg { color: var(--muted); }
.task.done svg { color: var(--ok); }
/* details panel */
.isec { padding: 14px 16px; border-bottom: 1px solid var(--line); display: flex; flex-direction: column; gap: 10px; }
.prop { display: grid; grid-template-columns: 84px minmax(0, 1fr); gap: 8px; font-size: 12.5px; margin: 0; }
.prop dt { color: var(--muted); }
.prop dd { margin: 0; display: flex; align-items: center; gap: 6px; min-width: 0; }
.act { display: flex; gap: 10px; font-size: 12.5px; }
.act b { font-weight: 650; }
/* forms */
.form { display: flex; flex-direction: column; gap: 14px; max-width: 560px; }
.fgroup { border: 1px solid var(--line); border-radius: var(--r-lg); background: var(--surface); padding: 16px 18px; display: flex; flex-direction: column; gap: 12px; }
.field { display: flex; flex-direction: column; gap: 6px; font-size: 12.5px; font-weight: 600; }
.tg { display: flex; align-items: center; gap: 10px; font-size: 13px; }
.tgl { width: 34px; height: 20px; border-radius: 99px; background: color-mix(in srgb, var(--muted) 40%, transparent); position: relative; flex: none; }
.tgl::after { content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: var(--surface); box-shadow: var(--shadow); }
.tgl.on { background: var(--accent); }
.tgl.on::after { left: 16px; }
.auth { height: 100%; display: grid; place-items: center; position: relative; overflow: hidden; }
.auth-card { width: 380px; border: 1px solid var(--line); border-radius: var(--r-lg); box-shadow: var(--shadow-lg); padding: 32px 30px 26px; display: flex; flex-direction: column; gap: 14px; position: relative; background: var(--panel-strong); backdrop-filter: var(--blur); }
.auth-card h1 { font-size: 22px; letter-spacing: -.015em; }
.auth-card .btn.pri { height: 40px; justify-content: center; font-size: 14px; }
/* shells */
.side { display: flex; flex-direction: column; gap: 2px; padding: 14px 10px; border-right: 1px solid var(--line); background: var(--panel); backdrop-filter: var(--blur); min-height: 0; }
.side .brand { display: flex; align-items: center; gap: 10px; padding: 2px 8px 14px; }
.side .foot { margin-top: auto; display: flex; align-items: center; gap: 10px; padding: 12px 8px 0; border-top: 1px solid var(--line); font-size: 12.5px; }
.main { display: flex; flex-direction: column; min-width: 0; min-height: 0; background: var(--surface); }
.hd { display: flex; align-items: center; gap: 12px; height: 60px; padding: 0 24px; border-bottom: 1px solid var(--line); flex: none; --ic: 14px; }
.hd .crumb { display: flex; align-items: center; gap: 6px; font-size: 15px; font-weight: 650; }
.hd .r { margin-left: auto; display: flex; gap: 8px; align-items: center; }
.pad { padding: 22px 24px; display: flex; flex-direction: column; gap: 16px; min-height: 0; overflow: hidden; flex: 1; }
.cols { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 20px; align-items: start; }
.stack { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.boxc { border: 1px solid var(--line); border-radius: var(--r-lg); background: var(--surface); overflow: hidden; }
.boxc .isec:last-child { border-bottom: 0; }
.rail { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 10px 0; border-right: 1px solid var(--line); background: var(--panel); backdrop-filter: var(--blur); }
.rail .logo { margin-bottom: 10px; width: 30px; height: 30px; }
.rail .ib { width: 38px; height: 38px; --ic: 19px; border-radius: var(--r); }
.rail .grow { flex: 1; }
.col { display: flex; flex-direction: column; min-width: 0; min-height: 0; overflow: hidden; background: var(--panel); backdrop-filter: var(--blur); }
.col.l { border-right: 1px solid var(--line); }
.col.r { border-left: 1px solid var(--line); }
.col-h { display: flex; align-items: center; justify-content: space-between; height: 52px; padding: 0 10px 0 16px; flex: none; }
.lrow { display: flex; align-items: center; gap: 10px; padding: 9px 12px; margin: 0 8px; border-radius: var(--r-sm); font-size: 13px; }
.lrow .tx { min-width: 0; flex: 1; }
.lrow .tx b { display: block; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lrow .tx span { font-size: 11.5px; color: var(--muted); }
.lrow.sel { background: var(--sel); color: var(--sel-fg); }
.lrow.sel .tx span { color: inherit; opacity: .75; }
.tmain { padding: 26px 30px; display: flex; flex-direction: column; gap: 16px; overflow: hidden; min-width: 0; background: var(--surface); }
.tb { display: flex; align-items: center; gap: 18px; padding: 0 24px; border-bottom: 1px solid var(--line); background: var(--panel); backdrop-filter: var(--blur); }
.tb .brand { display: flex; align-items: center; gap: 10px; }
.tabs { display: flex; gap: 4px; align-self: stretch; }
.tabs span { display: flex; align-items: center; padding: 0 12px; color: var(--muted); font-weight: 600; border-bottom: 2px solid transparent; }
.tabs span.on { color: var(--text); border-bottom-color: var(--accent); }

.lcard { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.lcard.chosen { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
.lcard h3 { margin: 0; }
.lstage { display: grid; grid-template-columns: 1fr 1fr; border-radius: 10px; overflow: hidden; border: 1px solid var(--line); }
.lstage > div { padding: 18px 14px; display: flex; flex-direction: column; align-items: center; gap: 14px; }
.ltile { display: grid; place-items: center; flex: none; }
.lsizes { display: flex; align-items: flex-end; gap: 10px; }
.llock { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 15px; letter-spacing: -.01em; white-space: nowrap; }
.llock small { display: block; font-size: 10.5px; font-weight: 500; letter-spacing: 0; opacity: .7; }
.ltab { display: flex; align-items: center; gap: 6px; font-size: 11.5px; padding: 6px 10px; border-radius: 8px 8px 0 0; align-self: stretch; }
@media (max-width: 900px) { .lgrid { grid-template-columns: 1fr; } }
@media (max-width: 640px) { .lstage { grid-template-columns: 1fr; } }

/* round 3: navigator */
.segbar { display: flex; gap: 2px; align-items: center; height: 14px; }
.segbar i { flex: 1; height: 6px; border-radius: 2px; background: var(--line); }
.segbar i.a { background: var(--accent); opacity: .55; }
.segbar i.r { background: var(--ok); opacity: .75; }
.segbar i.w { background: var(--danger); opacity: .8; }
.segbar i.c { height: 14px; opacity: 1; background: var(--text); }
.qcount { display: inline-flex; align-items: center; gap: 5px; height: 30px; padding: 0 10px; border: 1px solid var(--line); border-radius: var(--r-sm); background: var(--surface); font-size: 12.5px; white-space: nowrap; font-variant-numeric: tabular-nums; --ic: 14px; }
.qpop { position: absolute; left: 50%; bottom: 76px; transform: translateX(-50%); width: 420px; z-index: 4; background: var(--raised); border: 1px solid var(--line); border-radius: var(--r-lg); box-shadow: var(--shadow-lg); padding: 14px; display: flex; flex-direction: column; gap: 12px; }
.qpop.m { position: static; transform: none; width: auto; box-shadow: none; border: 0; padding: 0; }
.qpop .qd { height: 28px; font-size: 11px; }
.lg { display: inline-block; width: 12px; height: 12px; border-radius: 3px; border: 1px solid var(--line); background: var(--surface); }
.lg.a { background: var(--accent-soft); border-color: transparent; }
.lg.c { background: var(--accent); border-color: var(--accent); }
.lg.r { background: color-mix(in srgb, var(--ok) 25%, var(--surface)); border-color: transparent; }
.lg.w { background: color-mix(in srgb, var(--danger) 25%, var(--surface)); border-color: transparent; }
.mnav { flex: none; padding: 8px 12px 18px; border-top: 1px solid var(--line); background: var(--raised); display: flex; flex-direction: column; gap: 8px; }
.mnav .crow { justify-content: space-between; }
.mnav .segbar { height: 10px; }
.mnav .segbar i { height: 4px; }

.pager { display: flex; align-items: center; gap: 4px; }
.pager .qd { width: 28px; height: 28px; font-size: 11px; }

        ['Shell', 'Top bar as designed; tabs collapse to the icon-over-label strip under 900px (not 640px) so tablets don’t overflow. ⌘K searches the current track, or every track on the dashboard; terms open the glossary with <code class="c">?q=</code>, sections open Learn at <code class="c">?ch=&amp;s=</code>.', 'Five tabs plus the search bar don’t fit between 640 and 900px.'],
        ['Dashboard', 'Next-up uses the started track with the most studied sections; readiness names the chapter with the most unstudied sections. First-visit and storage-blocked states as designed.', 'No new storage: derived from studied ids and chapter order only.'],
        ['Track page', 'Exam facts come from a new <code class="c">exam</code> field in tracks.js. CT-AI v2.0 shows 44 points, pass at 29.', 'Deviation: the mockup said 26/40; the real sample exam is 44 points.'],
        ['Learn', 'Reader A, with chapter intro, objectives and keywords shown above the first section. URL keeps the place (<code class="c">?ch=&amp;s=</code>); the old v1 <code class="c">?ch=N</code> link still works.', 'Keeps all chapter content from the old pages.'],
        ['Insights', 'All insights of the chapter in the side column, labelled Trap / Key / Insight by keyword.', 'Union of the per-track keyword rules from the old pages.'],
        ['Exam', 'Navigator A and finish confirm B as designed; grid and confirm become bottom sheets under 640px. Practice and review use the same bar (right/wrong).', '—'],
        ['Practice reveal', 'Correct options green for every track.', 'Deviation: CT-AI v1 used to show a missed correct option in yellow.'],
        ['Icons and mark', 'lucide-react 0.460; Test brackets mark in the top bar, <code class="c">favicon.svg</code>, 32px PNG and 180px apple-touch icon.', '—'],
        ['Follow-ups', 'Phone Learn footer is not sticky; Parchment / Answer Sheet palettes not built; the CT-SS quiz rules still say “Prerequisite: CTFL certificate” (track page says none) — copied as-is.', 'Out of scope; content unchanged on purpose.']
      ])
    }
  ];

  /* ═══════════════════ END OF DATA — page shell below ═══════════════════ */

  const DW = 1280, PW = 310, PH = 650;
  const first = o => Object.keys(o)[0];
  const state = { pal: first(PALETTES), theme: 'light', dev: 'both' };
  try { if (matchMedia('(prefers-color-scheme: dark)').matches) state.theme = 'dark'; } catch (e) {}
  for (const [k, s] of Object.entries(SWITCHES)) state[k] = first(s.options);

  // Palette tokens: one rule per palette × theme.
  const SH = {
    light: { shadow: '0 1px 2px rgba(16,20,28,.06), 0 4px 14px rgba(16,20,28,.06)', shadowLg: '0 14px 36px rgba(16,20,28,.16), 0 2px 6px rgba(16,20,28,.06)', scrim: 'rgba(14,17,22,.34)' },
    dark: { shadow: '0 1px 2px rgba(0,0,0,.4), 0 6px 18px rgba(0,0,0,.32)', shadowLg: '0 18px 44px rgba(0,0,0,.6), 0 2px 6px rgba(0,0,0,.4)', scrim: 'rgba(0,0,0,.58)' }
  };
  const tokensOf = (p, t) => {
    const c = p[t];
    return {
      app: c.app, surface: c.surface, 'surface-2': c.surface2, raised: c.raised, line: c.line, text: c.text, muted: c.muted,
      accent: c.accent, 'accent-fg': c.accentFg, 'accent-soft': c.accentSoft, sel: c.sel, 'sel-fg': c.selFg,
      danger: c.danger, ok: c.ok, warn: c.warn || c.muted, chip: c.chip,
      panel: c.glass || c.surface2, 'panel-strong': c.glassStrong || c.raised, blur: p.blur,
      backdrop: p.blur !== 'none' ? `radial-gradient(900px 520px at 8% -8%, ${c.glow1 || c.app}, transparent 62%), radial-gradient(800px 520px at 105% 110%, ${c.glow2 || c.app}, transparent 60%), ${c.app}` : c.app,
      shadow: SH[t].shadow, 'shadow-lg': SH[t].shadowLg, scrim: SH[t].scrim,
      'font-ui': p.ui, 'font-read': p.read || p.ui, 'font-mono': p.mono, fs: p.fs + 'px', r: p.r + 'px', 'r-sm': p.rsm + 'px', 'r-lg': p.rlg + 'px'
    };
  };
  let css = '';
  for (const [k, p] of Object.entries(PALETTES)) for (const t of ['light', 'dark']) {
    css += `.p-${k}.t-${t}{${Object.entries(tokensOf(p, t)).map(([n, x]) => `--${n}:${x}`).join(';')};color-scheme:${t}}\n`;
  }
  const tokenStyle = document.createElement('style'); tokenStyle.textContent = css; document.head.appendChild(tokenStyle);

  // ───── helpers for section bodies ─────
  let where = '';
  const themesFor = () => state.theme === 'both' ? ['light', 'dark'] : [state.theme];
  const mk = (html, t, w, h, pal, bg) => `<div class="mock p-${pal || state.pal} t-${t}" style="width:${w}px;height:${h}px${bg ? ';background:transparent' : ''}">${html}</div>`;
  const fD = (html, t, cap, h = 760, pal) => `<div><div class="fcap"><span>${cap} · Desktop</span><span>${PALETTES[pal || state.pal].name} · ${t}</span></div><div class="frame" data-w="${DW}" data-h="${h}" data-device="desktop" data-where="${where}">${mk(html, t, DW, h, pal)}</div></div>`;
  const fP = (html, t, cap) => `<div><div class="fcap"><span>${cap} · Phone</span><span>${t}</span></div><div class="frame ph" data-w="${PW}" data-h="${PH}" data-device="phone" data-where="${where}">${mk(html, t, PW, PH, '', 1)}</div></div>`;
  // Desktop and phone side by side, once per theme; follows the Device switch.
  function pair(d, m, cap, h) {
    const ts = themesFor();
    if (state.dev === 'mobile') return `<div class="phones">${ts.map(t => fP(m(), t, cap)).join('')}</div>`;
    return `<div class="frames">${ts.map(t => `<div class="drow${state.dev === 'both' ? ' both' : ''}">${fD(d(), t, cap, h)}${state.dev === 'both' ? fP(m(), t, cap) : ''}</div>`).join('')}</div>`;
  }
  const desk = (d, cap, h) => `<div class="frames">${themesFor().map(t => fD(d(), t, cap, h)).join('')}</div>`;
  const note = (title, text) => text ? `<div class="notes"><p class="note"><b>${title}</b>${text}</p></div>` : '';
  const answer = (q, text, rec) => `<div class="answer"><b class="q">${q}</b>${rec ? '<span class="rec-tag">Recommend</span>' : ''}${text}</div>`;
  const rules = items => `<div class="notes"><div class="answer"><b class="q">Rules carried over</b><ul>${items.map(i => `<li>${i}</li>`).join('')}</ul></div></div>`;
  // A switch inside a section; its value is state[key] (defaults to the first option).
  function local(key, label, opts) {
    if (!(key in state)) state[key] = first(opts);
    return `<div class="local"><span>${label}</span><div class="segc">${Object.entries(opts).map(([k, l]) => `<button type="button" data-k="${key}" data-v="${k}" aria-pressed="${state[key] === k}">${l}</button>`).join('')}</div></div>`;
  }
  // A/B/C proposals side by side, each with a desktop mockup in the first theme shown.
  const options = list => `<div class="opt3">${list.map((o, i) => `<div class="card${o.rec ? ' chosen' : ''}"><h3>${String.fromCharCode(65 + i)} · ${o.name}${o.rec ? ' <span class="rec-tag">Recommend</span>' : ''}</h3><p class="small">${o.text}</p><div class="frame" data-w="${DW}" data-h="${o.h || 760}" data-device="desktop" data-where="${where}/${String.fromCharCode(97 + i)}">${mk(o.html(), themesFor()[0], DW, o.h || 760)}</div></div>`).join('')}</div>`;
  const table = (head, rows) => `<div class="tablewrap"><table><thead><tr>${head.map(h => `<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.map(r => `<tr>${r.map((c, i) => i ? `<td>${c}</td>` : `<th>${c}</th>`).join('')}</tr>`).join('')}</tbody></table></div>`;
  const ledger = () => table(['Screen', 'Pick', 'What changes', 'Status'], LEDGER.map(r => [r[0], r[1], r[2], r[3] === 'ok' ? '<span class="st-ok">Decided</span>' : `<a class="st-q" href="${r[4]}">Open</a>`]));
  const flow = steps => `<div class="flow" style="--n:${steps.length}">${steps.map(([b, s, hl]) => `<div${hl ? ' class="hl"' : ''}><b>${b}</b><span>${s}</span></div>`).join('')}</div>`;
  const paletteCards = () => `<div class="palgrid">${Object.entries(PALETTES).map(([k, p]) => `<div class="palcard${k === state.pal ? ' on' : ''}"><div class="top"><h3>${p.name}</h3><span class="small" style="font-family:${p.ui}">${p.fontLabel}</span></div><div class="small">${p.note}</div>
    ${['light', 'dark'].map(t => `<div class="chips">${['app', 'surface', 'line', 'text', 'muted', 'accent', 'accentSoft'].map(c => `<i style="background:${p[t][c]}"></i>`).join('')}</div>`).join('')}
    <div class="frame" data-w="${DW}" data-h="760" data-device="desktop" data-where="${where}/${k}">${mk(hubDesk('returning'), themesFor()[0], DW, 760, k)}</div>
    ${Object.keys(PALETTES).length > 1 ? `<button type="button" class="linkbtn" data-k="pal" data-v="${k}">${k === state.pal ? 'In use on this page' : 'Use this palette'}</button>` : ''}</div>`).join('')}</div>`;
  const tokenTable = () => {
    const p = PALETTES[state.pal], L = tokensOf(p, 'light'), D = tokensOf(p, 'dark');
    const cell = v => `${/^#|^rgba?\(/.test(v) ? `<span class="swatch" style="background:${v}"></span>` : ''}<code class="c">${v}</code>`;
    return table(['Token', 'Light', 'Dark'], Object.keys(L).filter(k => !/^(shadow|backdrop|font|blur)/.test(k)).map(k => [`<code class="c">--${k}</code>`, cell(L[k]), cell(D[k])]));
  };

  // ───── controls + render ─────
  function seg(label, key, opts) {
    return `<div class="ctl"><span>${label}</span><div class="segc">${Object.entries(opts).map(([k, l]) => `<button type="button" data-k="${key}" data-v="${k}" aria-pressed="${state[key] === k}">${l}</button>`).join('')}</div></div>`;
  }
  function fit() {
    document.querySelectorAll('.frame').forEach(f => {
      const W = +f.dataset.w, H = +f.dataset.h, s = f.clientWidth / W;
      f.style.height = (H * s) + 'px';
      f.firstElementChild.style.transform = `scale(${s})`;
    });
  }
  function renderAll() {
    document.getElementById('controls').innerHTML = [
      Object.keys(PALETTES).length > 1 ? seg('Palette', 'pal', Object.fromEntries(Object.entries(PALETTES).map(([k, p]) => [k, p.name]))) : '',
      seg('Theme', 'theme', { light: 'Light', dark: 'Dark', both: 'Both' }),
      seg('Device', 'dev', { both: 'Both', desktop: 'Desktop', mobile: 'Phone' }),
      ...Object.entries(SWITCHES).map(([k, s]) => seg(s.label, k, s.options))
    ].join('');
    document.getElementById('stage').innerHTML = SECTIONS.map(s => {
      where = s.id;
      return `<section class="sec" id="${s.id}" data-section="${s.id}"><div class="sec-h"><div><h2>${s.name}</h2><p>${s.intro || ''}</p></div><div>${(s.answers || []).map(a => answer(a.q, a.text, a.rec)).join('')}</div></div>${s.body()}</section>`;
    }).join('');
    if (window.lucide) { try { lucide.createIcons({ icons: lucide.icons }); } catch (e) {} }
    fit();
  }
  document.addEventListener('click', e => {
    const b = e.target.closest('button[data-k]'); if (!b) return;
    state[b.dataset.k] = b.dataset.v; renderAll();
  });
  window.addEventListener('resize', fit);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(fit);

  document.getElementById('eyebrow').textContent = PAGE.eyebrow;
  document.getElementById('title').textContent = PAGE.title;
  document.getElementById('lede').innerHTML = PAGE.lede.map(x => `<p class="lede">${x}</p>`).join('');
  document.getElementById('toc').innerHTML = SECTIONS.map(s => `<a href="#${s.id}">${s.name}</a>`).join('');
  document.getElementById('footer').textContent = PAGE.footer;

  // Used by ../design-directions/scripts/render.cjs to screenshot every section.
  window.DESIGN = { kind: 'blueprint', sections: SECTIONS.map(s => s.id) };
  window.setDesignState = partial => { Object.assign(state, partial); renderAll(); };
  renderAll();
})();
</script>
