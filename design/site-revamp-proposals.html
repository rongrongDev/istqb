<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ISTQB Hub Revamp</title>
<!--
  Starter for the stage-1 comparison page. Copy it into the project
  (e.g. design/<slug>-proposals.html) and replace the "PROPOSAL DATA" and
  "MOCKUPS" blocks in the script. The page shell (control bar, scaled device
  frames, side-by-side view, palette cards, at-a-glance table) normally needs
  no edits; keep window.DESIGN / window.setDesignState, which
  scripts/render.cjs uses.

  Mockups are plain HTML strings styled by palette tokens (--app, --surface,
  --text, --accent, --r, --font-ui …) generated for every palette × theme.
  Mark decorative elements that deliberately bleed past a frame edge with
  data-bleed so the render check ignores them.

  Works as an Artifact page and as a local file. State lives in the hash:
  #dir=compare&screen=home&pal=graphite&theme=dark&dev=both
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=Figtree:wght@400;500;600;700;800&family=Literata:opsz,wght@7..72,400;7..72,600&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap">
<style>
/* Page: sticky control bar (layout · device · palette · theme · screen) over scaled mockups, then a comparison table and the recommendation. */
:root {
  --bg: #f3f4f6; --card: #ffffff; --fg: #14161b; --muted: #5c6270; --line: #dde0e6;
  --accent: #2f4fd1; --accent-soft: #e6ebfc;
  --font-body: 'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif;
  --font-mono: 'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d0e11; --card: #15171c; --fg: #e8e9ed; --muted: #969bab; --line: #2a2d35;
    --accent: #8ea4ff; --accent-soft: #1f2540; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d0e11; --card: #15171c; --fg: #e8e9ed; --muted: #969bab; --line: #2a2d35;
  --accent: #8ea4ff; --accent-soft: #1f2540; color-scheme: dark;
}
html, body { background: var(--bg); color: var(--fg); }
body { margin: 0; font-family: var(--font-body); font-size: 15px; line-height: 1.55; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.wrap { max-width: 1240px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.eyebrow { font-family: var(--font-mono); font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
h1 { font-size: clamp(28px, 4vw, 40px); line-height: 1.12; letter-spacing: -.02em; margin: 6px 0 10px; text-wrap: balance; }
h2 { font-size: 22px; letter-spacing: -.01em; margin: 0 0 12px; text-wrap: balance; }
h3 { font-size: 16px; margin: 0 0 8px; }
p { margin: 0 0 10px; }
.lede { color: var(--muted); max-width: 72ch; font-size: 16px; }
header.top { padding-block: 40px 20px; }

.controls { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
.controls .wrap { display: flex; flex-wrap: wrap; gap: 10px 20px; padding-block: 10px; align-items: center; }
.ctl { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.ctl > span { font-family: var(--font-mono); font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.segc { display: inline-flex; flex-wrap: wrap; border: 1px solid var(--line); border-radius: 8px; background: var(--card); padding: 2px; gap: 2px; }
.segc button { font: inherit; font-size: 13.5px; font-weight: 500; border: 0; background: transparent; color: var(--muted); padding: 5px 10px; border-radius: 6px; cursor: pointer; }
.segc button:hover { color: var(--fg); }
.segc button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

main.stage { padding-block: 24px 8px; }
.dir-intro { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.1fr); gap: 24px; align-items: start; margin-bottom: 18px; }
.dir-intro h2 { font-size: 30px; margin: 0; }
.tagline { color: var(--muted); font-size: 16px; margin: 2px 0 10px; }
.chips-row { display: flex; flex-wrap: wrap; gap: 6px; }
.pchip { font-size: 12.5px; border: 1px solid var(--line); border-radius: 99px; padding: 2px 10px; color: var(--muted); background: var(--card); }
.kv { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 7px 14px; font-size: 14px; background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; margin: 0; }
.kv dt { color: var(--muted); font-family: var(--font-mono); font-size: 11px; text-transform: uppercase; letter-spacing: .05em; padding-top: 3px; white-space: nowrap; }
.kv dd { margin: 0; min-width: 0; }

.frames { display: grid; gap: 16px; }
.fcap { font-family: var(--font-mono); font-size: 11.5px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; margin-bottom: 6px; display: flex; justify-content: space-between; gap: 8px; }
.frame { position: relative; overflow: hidden; border-radius: 10px; border: 1px solid var(--line); background: var(--card); }
.frame.ph { border: 0; background: transparent; border-radius: 38px; }
.drow { display: grid; gap: 16px; align-items: start; }
.drow.both { grid-template-columns: minmax(0, 3.3fr) minmax(0, 1fr); }
.drow + .drow { margin-top: 18px; }
.phones { display: flex; flex-wrap: wrap; gap: 20px; }
.phones > div { width: min(290px, 100%); }

.details { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; margin-top: 20px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 16px; min-width: 0; }
.sw-theme { font-family: var(--font-mono); font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 10px 0 6px; }
.swatches { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
.sw { border: 1px solid var(--line); border-radius: 6px; overflow: hidden; font-size: 11px; }
.sw i { display: block; height: 28px; }
.sw b { display: block; font-weight: 500; padding: 3px 6px 0; }
.sw code { display: block; font-family: var(--font-mono); font-size: 10.5px; color: var(--muted); padding: 0 6px 4px; }
.small { font-size: 13.5px; color: var(--muted); }
.spec { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 6px 12px; font-size: 13.5px; margin: 10px 0 0; }
.spec dt { color: var(--muted); }
.spec dd { margin: 0; }
.notes { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; margin: 14px 0 0; }
.notes.one { grid-template-columns: minmax(0, 1fr); }
.note { font-size: 14px; background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; margin: 0; }
.note b { display: block; font-size: 12px; font-family: var(--font-mono); text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 500; margin-bottom: 4px; }

.compare { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 28px 20px; }
.cmp-h { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin-bottom: 8px; }
.cmp-h h3 { font-size: 19px; margin: 0; }
.cmp-h p { margin: 0; color: var(--muted); font-size: 13.5px; }
.cmp-row + .cmp-row { margin-top: 26px; }
.cmp-cell .frames { gap: 8px; }
.linkbtn { font: inherit; font-size: 13px; border: 1px solid var(--line); background: var(--card); color: var(--accent); border-radius: 6px; padding: 3px 10px; cursor: pointer; white-space: nowrap; }

section.block { padding-block: 36px 8px; }
.tablewrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 10px; background: var(--card); }
table { border-collapse: collapse; width: 100%; min-width: 860px; font-size: 13.5px; }
th, td { text-align: left; vertical-align: top; padding: 11px 14px; border-top: 1px solid var(--line); }
thead th { border-top: 0; font-family: var(--font-mono); font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 500; }
tbody th { font-size: 15px; white-space: nowrap; }
.rec { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); gap: 20px; }
.rec .card { padding: 20px; }
.rec ol { margin: 0; padding-left: 20px; display: grid; gap: 6px; }
.verdict { font-size: 20px; font-weight: 600; letter-spacing: -.01em; margin-bottom: 8px; text-wrap: balance; }
.verdict em { font-style: normal; color: var(--accent); }
footer { padding-block: 32px 48px; color: var(--muted); font-size: 13.5px; }

.grow2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; margin-top: 16px; }
.grow3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; margin-top: 16px; }
.grow3 .card.pick { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
.fl { list-style: none; margin: 10px 0 0; padding: 0; display: grid; gap: 12px; }
.fl li { display: grid; gap: 2px; font-size: 14px; }
.fl li b { font-weight: 600; }
.fl li span { color: var(--muted); font-size: 13px; }
.fl li code, .card code, td code { font-family: var(--font-mono); font-size: 12px; background: var(--accent-soft); padding: 0 4px; border-radius: 4px; }
.tag { display: inline-block; font-family: var(--font-mono); font-size: 10.5px; text-transform: uppercase; letter-spacing: .05em; padding: 1px 6px; border-radius: 4px; border: 1px solid var(--line); color: var(--muted); margin-right: 4px; }
.card ul.plain { margin: 6px 0 0; padding-left: 18px; display: grid; gap: 4px; font-size: 14px; }
@media (max-width: 900px) { .dir-intro, .rec, .details, .compare, .grow2, .grow3 { grid-template-columns: 1fr; } }
@media (max-width: 700px) { .drow.both, .notes { grid-template-columns: minmax(0, 1fr); } .drow.both > div:last-child { max-width: 290px; } }
@media (max-width: 640px) { .swatches { grid-template-columns: repeat(3, minmax(0, 1fr)); } }

/* ───────── Mockups. Palette tokens come from generated .p-<palette>.t-<theme> rules ───────── */
.mock { position: absolute; top: 0; left: 0; transform-origin: 0 0; font-family: var(--font-ui); font-size: var(--fs); line-height: 1.4; color: var(--text); background: var(--backdrop); overflow: hidden; -webkit-font-smoothing: antialiased; text-align: left; }
.mock * { box-sizing: border-box; }
.mock svg, .mock i[data-lucide] { width: var(--ic, 16px); height: var(--ic, 16px); flex: none; stroke-width: 1.75; display: inline-block; }
.mock h1, .mock h2, .mock h3, .mock p { margin: 0; }
.mock h2 { font-size: 22px; letter-spacing: -.015em; }
.mock .mu { color: var(--muted); }
.mock .ok { color: var(--ok); }
.ib { width: 30px; height: 30px; display: grid; place-items: center; background: transparent; color: var(--muted); border-radius: var(--r-sm); flex: none; }
.ib.on { background: var(--accent-soft); color: var(--accent); }
.btn { display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 12px; border-radius: var(--r-sm); border: 1px solid var(--line); background: var(--surface); color: var(--text); font-size: 12.5px; font-weight: 600; white-space: nowrap; --ic: 14px; }
.btn.pri { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
.lbl { font-size: 11px; font-weight: 650; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); }
.inp { height: 34px; display: flex; align-items: center; gap: 8px; padding: 0 12px; border: 1px solid var(--line); border-radius: var(--r-sm); background: var(--surface); color: var(--muted); min-width: 0; --ic: 15px; }
.inp.filled { color: var(--text); }
.chip { display: inline-flex; align-items: center; gap: 5px; height: 22px; padding: 0 8px; border-radius: 99px; font-size: 11.5px; background: var(--chip); color: var(--muted); border: 1px solid var(--line); white-space: nowrap; --ic: 12px; }
.chip.acc { background: var(--accent-soft); color: var(--accent); border-color: transparent; }
.chip.ok { color: var(--ok); }
.chip.warn { color: var(--warn); }
.meter { display: block; height: 5px; border-radius: 99px; background: var(--line); overflow: hidden; }
.meter > span { display: block; height: 100%; background: var(--accent); border-radius: inherit; }
.avatar { width: 28px; height: 28px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); font-size: 11px; font-weight: 700; display: grid; place-items: center; flex: none; }
.avatar.sm { width: 22px; height: 22px; font-size: 9.5px; }
.avs { display: flex; }
.avs .avatar { border: 2px solid var(--surface); margin-left: -6px; }
.avs .avatar:first-child { margin-left: 0; }
kbd.k { font-family: var(--font-mono); font-size: 11px; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 5px; padding: 0 5px; color: var(--muted); background: var(--surface); white-space: nowrap; }
.logo { width: 24px; height: 24px; border-radius: var(--r-sm); background: var(--accent); color: var(--accent-fg); display: grid; place-items: center; font-weight: 800; font-size: 12.5px; flex: none; }
.logo.lg { width: 38px; height: 38px; font-size: 18px; border-radius: var(--r); }
.wm { font-weight: 750; font-size: 17px; letter-spacing: -.015em; }
.dot { width: 10px; height: 10px; border-radius: 3px; background: var(--h); flex: none; }
.crow { display: flex; align-items: center; gap: 8px; min-width: 0; }
.crow .meter { flex: 1; max-width: 220px; }
/* lists, tables, cards */
.nv { display: flex; align-items: center; gap: 10px; height: 34px; padding: 0 10px; border-radius: var(--r); font-weight: 550; white-space: nowrap; --ic: 16px; }
.nv svg { color: var(--muted); }
.nv.on { background: var(--sel); color: var(--sel-fg); font-weight: 650; }
.nv.on svg { color: currentColor; }
.nv .n { margin-left: auto; font-size: 11.5px; color: var(--muted); font-weight: 500; }
.nv-h { margin: 14px 10px 4px; }
.tbl { border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; background: var(--surface); }
.trow { display: grid; grid-template-columns: minmax(0, 2fr) .8fr 1fr .6fr 1.1fr .9fr; gap: 12px; align-items: center; padding: 10px 14px; font-size: 12.5px; }
.trow + .trow { border-top: 1px solid var(--line); }
.trow.th { background: var(--surface-2); font-family: var(--font-mono); font-size: 10.5px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.trow.sel { background: var(--sel); color: var(--sel-fg); }
.trow.sel .mu, .trow.sel .num { color: inherit; opacity: .75; }
.trow.sel .meter { background: color-mix(in srgb, currentColor 22%, transparent); }
.trow.sel .meter > span { background: currentColor; }
.trow .nm { display: flex; align-items: center; gap: 10px; font-weight: 650; font-size: 13px; min-width: 0; }
.trow .num { font-family: var(--font-mono); color: var(--muted); }
.cgrid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
.ccard { border: 1px solid var(--line); border-radius: var(--r-lg); background: var(--surface); overflow: hidden; box-shadow: var(--shadow); }
.ccard.sel { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
.ccard .cov { height: 92px; background: linear-gradient(135deg, var(--h), color-mix(in oklab, var(--h) 45%, var(--surface))); }
.ccard .cap { padding: 12px 14px; display: flex; flex-direction: column; gap: 9px; }
.ccard .cap b { font-size: 14px; }
.ccard .crow { font-size: 12px; color: var(--muted); }
.cgrid.m2 { grid-template-columns: 1fr 1fr; gap: 10px; padding: 12px; }
.m2 .ccard .cov { height: 54px; }
.m2 .ccard .cap { padding: 9px 10px; gap: 6px; }
.m2 .ccard .cap b { font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.m2 .ccard .crow > span:not(.chip) { display: none; }
.tasks { border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); }
.task { display: flex; align-items: center; gap: 10px; padding: 10px 14px; font-size: 13px; }
.task + .task { border-top: 1px solid var(--line); }
.task.done span { color: var(--muted); text-decoration: line-through; }
.task svg { color: var(--muted); }
.task.done svg { color: var(--ok); }
/* details panel */
.isec { padding: 14px 16px; border-bottom: 1px solid var(--line); display: flex; flex-direction: column; gap: 10px; }
.prop { display: grid; grid-template-columns: 84px minmax(0, 1fr); gap: 8px; font-size: 12.5px; margin: 0; }
.prop dt { color: var(--muted); }
.prop dd { margin: 0; display: flex; align-items: center; gap: 6px; min-width: 0; }
.act { display: flex; gap: 10px; font-size: 12.5px; }
.act b { font-weight: 650; }
/* forms */
.form { display: flex; flex-direction: column; gap: 14px; max-width: 560px; }
.fgroup { border: 1px solid var(--line); border-radius: var(--r-lg); background: var(--surface); padding: 16px 18px; display: flex; flex-direction: column; gap: 12px; }
.field { display: flex; flex-direction: column; gap: 6px; font-size: 12.5px; font-weight: 600; }
.tg { display: flex; align-items: center; gap: 10px; font-size: 13px; }
.tgl { width: 34px; height: 20px; border-radius: 99px; background: color-mix(in srgb, var(--muted) 40%, transparent); position: relative; flex: none; }
.tgl::after { content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: var(--surface); box-shadow: var(--shadow); }
.tgl.on { background: var(--accent); }
.tgl.on::after { left: 16px; }
.auth { height: 100%; display: grid; place-items: center; position: relative; overflow: hidden; }
.auth-card { width: 380px; border: 1px solid var(--line); border-radius: var(--r-lg); box-shadow: var(--shadow-lg); padding: 32px 30px 26px; display: flex; flex-direction: column; gap: 14px; position: relative; background: var(--panel-strong); backdrop-filter: var(--blur); }
.auth-card h1 { font-size: 22px; letter-spacing: -.015em; }
.auth-card .btn.pri { height: 40px; justify-content: center; font-size: 14px; }
/* shells */
.side { display: flex; flex-direction: column; gap: 2px; padding: 14px 10px; border-right: 1px solid var(--line); background: var(--panel); backdrop-filter: var(--blur); min-height: 0; }
.side .brand { display: flex; align-items: center; gap: 10px; padding: 2px 8px 14px; }
.side .foot { margin-top: auto; display: flex; align-items: center; gap: 10px; padding: 12px 8px 0; border-top: 1px solid var(--line); font-size: 12.5px; }
.main { display: flex; flex-direction: column; min-width: 0; min-height: 0; background: var(--surface); }
.hd { display: flex; align-items: center; gap: 12px; height: 60px; padding: 0 24px; border-bottom: 1px solid var(--line); flex: none; --ic: 14px; }
.hd .crumb { display: flex; align-items: center; gap: 6px; font-size: 15px; font-weight: 650; }
.hd .r { margin-left: auto; display: flex; gap: 8px; align-items: center; }
.pad { padding: 22px 24px; display: flex; flex-direction: column; gap: 16px; min-height: 0; overflow: hidden; flex: 1; }
.cols { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 20px; align-items: start; }
.stack { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.boxc { border: 1px solid var(--line); border-radius: var(--r-lg); background: var(--surface); overflow: hidden; }
.boxc .isec:last-child { border-bottom: 0; }
.rail { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 10px 0; border-right: 1px solid var(--line); background: var(--panel); backdrop-filter: var(--blur); }
.rail .logo { margin-bottom: 10px; width: 30px; height: 30px; }
.rail .ib { width: 38px; height: 38px; --ic: 19px; border-radius: var(--r); }
.rail .grow { flex: 1; }
.col { display: flex; flex-direction: column; min-width: 0; min-height: 0; overflow: hidden; background: var(--panel); backdrop-filter: var(--blur); }
.col.l { border-right: 1px solid var(--line); }
.col.r { border-left: 1px solid var(--line); }
.col-h { display: flex; align-items: center; justify-content: space-between; height: 52px; padding: 0 10px 0 16px; flex: none; }
.lrow { display: flex; align-items: center; gap: 10px; padding: 9px 12px; margin: 0 8px; border-radius: var(--r-sm); font-size: 13px; }
.lrow .tx { min-width: 0; flex: 1; }
.lrow .tx b { display: block; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lrow .tx span { font-size: 11.5px; color: var(--muted); }
.lrow.sel { background: var(--sel); color: var(--sel-fg); }
.lrow.sel .tx span { color: inherit; opacity: .75; }
.tmain { padding: 26px 30px; display: flex; flex-direction: column; gap: 16px; overflow: hidden; min-width: 0; background: var(--surface); }
.tb { display: flex; align-items: center; gap: 18px; padding: 0 24px; border-bottom: 1px solid var(--line); background: var(--panel); backdrop-filter: var(--blur); }
.tb .brand { display: flex; align-items: center; gap: 10px; }
.tabs { display: flex; gap: 4px; align-self: stretch; }

        d: () => desk(`<nav class="side"><div class="brand"><span class="logo">Q</span><span class="wm">Exam simulation</span></div><div class="stack" style="gap:4px;padding:6px 8px 12px"><span class="lbl">Sample Exam A · 60 min</span>${timer(1)}<span class="mu sm">3 of 40 answered</span></div><div style="padding:0 8px">${qdots(5)}</div><div class="foot">${btn('Finish exam', 'flag', 'pri')}</div></nav>`, cr('CTFL v4.0', 'Quiz', 'Question 4'), btn('Previous', 'chevron-left') + btn('Next', 'chevron-right', 'pri'), `${qMeta()}${qText(1)}${opts()}`),
        m: () => phone(`${mh('Q4 / 40', 'Sample Exam A', ib('x'), timer())}${mb(mQuiz())}<div class="mnext">${btn('Previous')}<span class="mu">${I('grid-3x3')} 3/40</span>${btn('Next', '', 'pri')}</div>`)
      },
      result: {
        d: () => desk(deskSide(4), cr('CTFL v4.0', 'Quiz', 'Result'), '', `${verdict()}${breakdown(1)}${resultBtns()}`),
        m: () => deskPhone('Exam result', 'Sample Exam A', `${verdict()}${breakdown(0)}`, 4)
      }
    },
    exam: {
      hub: {
        d: () => ex(null, `<div class="g2a">${nextCard()}${readiness()}</div><div class="crow"><h2>Your tracks</h2><span class="mu sm" style="margin-left:auto">Progress stays in this browser</span></div><div class="g3">${TRACKS.map(tile).join('')}</div>`),
        m: () => phone(`${mh('ISTQB Hub', 'Dashboard', '', ib('search'))}${mb(`${nextCard()}${TRACKS.slice(0, 3).map(tile).join('')}`)}`)
      },
      track: {
        d: () => ex(0, `<div class="thead">${dot(TF.h)}<div class="stack" style="gap:4px"><span class="lbl">ISTQB · Foundation · Start here</span><h2>Foundation Level (CTFL v4.0)</h2></div></div>${examFacts()}${stats()}${stepper()}`),
        m: () => exPhone(`${examFacts()}${stats()}${pathRows(0)}`, null)
      },
      learn: {
        d: () => ex(0, `<div class="crow" style="gap:12px"><span class="lbl">Chapter 4 · Section 3 of 14</span>${meter(21)}<span class="mu sm" style="margin-left:auto">${I('list')} Chapter outline</span></div>${section(1)}<div class="crow">${btn('Previous: 4.2.1', 'chevron-left')}<span style="margin-left:auto">${btn('Mark studied & next', 'check', 'pri')}</span></div>`, '', 760),
        m: () => exPhone(`<span class="lbl">Ch 4 · Section 3 of 14</span>${section(0)}`, 0, `<div class="mnext">${btn('', 'chevron-left')}${btn('Mark studied & next', 'check', 'pri')}</div>`)
      },
      insights: {
        d: () => ex(2, `${chHead1('Exam insights')}<div class="g2a"><div class="stack" style="gap:14px">${insightItems(0)}</div><div class="stack" style="gap:10px"><span class="lbl">Traps in this chapter · 2 of 9</span><div class="callout bad"><span class="lbl">A-Q1 · Trap · 1.1.1</span><p>“Prove there are no unfixed defects” is never a valid objective — testing shows presence, not absence.</p></div><div class="callout nt"><span class="lbl">C-Q2 · Key · 1.1.2</span><p>“Testing determines that defects exist; debugging removes them.”</p></div></div></div>`),
        m: () => exPhone(insightItems(1), 2)
      },
      glossary: {
        d: () => ex(0, `<div class="crow" style="gap:12px"><span class="lbl">Chapter 4 · Section 3 of 14</span>${meter(21)}</div>${section(1)}`, palette(), 760),
        m: () => phone(`<div class="mh"><div class="inp filled" style="flex:1">${I('search')}boundary</div><b class="sm">Cancel</b></div>${mb(`<span class="lbl">Glossary · 2 matches</span><div class="tbl">${GLOSS.slice(3, 5).map(([t, r, d]) => `<div class="gl"><div class="crow"><b>${t}</b><span class="sid" style="margin-left:auto">§${r}</span></div><p>${d}</p></div>`).join('')}</div><span class="lbl">Sections</span><div class="stp"><span class="sid">4.2.2</span><div class="tx"><b>Boundary Value Analysis</b><span>Learn · Chapter 4</span></div></div>`)}`)
      },
      start: {
        d: () => `<div style="display:grid;grid-template-rows:56px minmax(0,1fr);height:100%">
          <header class="tb"><span class="crow mu sm">${I('chevron-left')} CTFL v4.0</span><b style="margin:0 auto">Exam check-in</b>${ib('moon')}</header>
          <main class="nbm"><div class="g2a" style="width:1080px;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)"><div class="stack" style="gap:16px">${ticket()}<span class="lbl">Choose a sample exam</span>${setCards(4)}${timeToggle()}<div class="startbig">${btn('Start Sample Exam A · 75 min', 'timer', 'pri')}<span class="mu sm">No feedback until you finish. Leaving the page ends the attempt.</span></div></div>
          <div class="stack" style="gap:12px"><span class="lbl">Or practise without a timer</span>${practiceCard()}</div></div></main></div>`,
        m: () => phone(`${mh('Exam check-in', 'CTFL v4.0', ib('chevron-left'), '')}${mb(`${ticket()}${setCards(2)}${timeToggle()}<span class="mu sm">Or practise without a timer below.</span>`)}<div class="mnext">${btn('Start Set A · 75 min', 'timer', 'pri')}</div>`)
      },
      review: {
        d: () => `<div style="display:grid;grid-template-rows:56px minmax(0,1fr) 64px;height:100%">
          <header class="tb"><b>Review · Sample Exam A</b><span class="crow" style="margin:0 auto;gap:8px"><b>29 / 40</b>${chip('Pass', 'ok')}<span class="mu sm">11 wrong</span></span>${btn('Back to result', 'x')}</header>
          <main class="nbm"><div class="g2a" style="width:1120px"><div class="stack" style="gap:16px">${rMeta()}${qText(1)}${ropts()}</div><div class="stack" style="gap:12px">${expl()}<div class="callout nt"><span class="lbl">Learn it again</span><p>Test analysis vs test design — Chapter 1, 1.4.1 Test Activities and Tasks.</p></div></div></div></main>
          <footer class="exf">${btn('← Previous')}<div style="flex:1">${rdots(40)}</div>${btn('Next →', '', 'pri')}</footer></div>`,
        m: () => phone(`<div class="mh"><b class="sm">Review · Q4 / 40</b><span style="margin-left:auto" class="crow sm"><b>29/40</b>${chip('Pass', 'ok')}</span></div>${mb(`${rMeta()}${qText()}${ropts()}${expl()}`)}<div class="mdots"><div data-bleed>${rdots(40)}</div></div>`)
      },
      quiz: {
        d: () => `<div style="display:grid;grid-template-rows:56px minmax(0,1fr) 64px;height:100%">
          <header class="tb"><b>Sample Exam A · Exam simulation</b><span style="margin:0 auto">${timer(1)}</span>${btn('Finish exam', 'flag')}</header>
          <main class="nbm"><div class="stack" style="width:760px;gap:18px">${qMeta()}${qText(1)}${opts()}</div></main>
          <footer class="exf">${btn('← Previous')}<div style="flex:1">${qdots(40)}</div>${btn('Next →', '', 'pri')}</footer></div>`,
        m: () => phone(`<div class="mh"><b class="sm">Q4 / 40</b><span style="margin:0 auto">${timer()}</span>${ib('flag')}</div>${mb(mQuiz())}<div class="mdots"><div data-bleed>${qdots(40)}</div></div>`)
      },
      result: {
        d: () => ex(4, `${verdict()}${breakdown(1)}<div class="crow" style="gap:8px">${btn('Review all answers & explanations', 'list-checks', 'pri')}${btn('Re-study Chapter 4', 'book-open')}${btn('Back to start', 'rotate-ccw')}</div>`, '', 900),
        m: () => exPhone(`${verdict()}${breakdown(0)}${btn('Review answers', 'list-checks', 'pri')}`, 4)
      }
    }
  };
  /* ═══════════════════ END OF DATA — page shell below ═══════════════════ */

  const THEMES = { light: 'Light', dark: 'Dark', both: 'Both' };
  const DEVICES = { both: 'Both', desktop: 'Desktop', mobile: 'Phone' };
  const DW = 1280, PW = 310, PH = 650;

  // Palette tokens: one rule per palette × theme.
  const SH = {
    light: { shadow: '0 1px 2px rgba(16,20,28,.06), 0 4px 14px rgba(16,20,28,.06)', shadowLg: '0 14px 36px rgba(16,20,28,.16), 0 2px 6px rgba(16,20,28,.06)', scrim: 'rgba(14,17,22,.34)' },
    dark: { shadow: '0 1px 2px rgba(0,0,0,.4), 0 6px 18px rgba(0,0,0,.32)', shadowLg: '0 18px 44px rgba(0,0,0,.6), 0 2px 6px rgba(0,0,0,.4)', scrim: 'rgba(0,0,0,.58)' }
  };
  let css = '';
  for (const [k, p] of Object.entries(PALETTES)) {
    for (const t of ['light', 'dark']) {
      const c = p[t];
      const v = {
        app: c.app, surface: c.surface, 'surface-2': c.surface2, raised: c.raised, line: c.line, text: c.text, muted: c.muted,
        accent: c.accent, 'accent-fg': c.accentFg, 'accent-soft': c.accentSoft, sel: c.sel, 'sel-fg': c.selFg,
        danger: c.danger, ok: c.ok, warn: c.warn || c.muted, chip: c.chip,
        panel: c.glass || c.surface2, 'panel-strong': c.glassStrong || c.raised, blur: p.blur,
        backdrop: p.blur !== 'none' ? `radial-gradient(900px 520px at 8% -8%, ${c.glow1 || c.app}, transparent 62%), radial-gradient(800px 520px at 105% 110%, ${c.glow2 || c.app}, transparent 60%), ${c.app}` : c.app,
        shadow: SH[t].shadow, 'shadow-lg': SH[t].shadowLg, scrim: SH[t].scrim,
        'font-ui': p.ui, 'font-read': p.read || p.ui, 'font-mono': p.mono, fs: p.fs + 'px', r: p.r + 'px', 'r-sm': p.rsm + 'px', 'r-lg': p.rlg + 'px'
      };
      css += `.p-${k}.t-${t}{${Object.entries(v).map(([n, x]) => `--${n}:${x}`).join(';')};color-scheme:${t}}\n`;
    }
  }
  const tokenStyle = document.createElement('style'); tokenStyle.textContent = css; document.head.appendChild(tokenStyle);

  // State: everything is in the hash so a link reopens the same view.
  const first = o => Object.keys(o)[0];
  let prefersDark = false;
  try { prefersDark = matchMedia('(prefers-color-scheme: dark)').matches; } catch (e) {}
  const state = { dir: first(LAYOUTS), screen: first(SCREENS), dev: 'both', pal: first(PALETTES), theme: prefersDark ? 'dark' : 'light' };
  const valid = { dir: k => LAYOUTS[k] || k === 'compare', screen: k => SCREENS[k], dev: k => DEVICES[k], pal: k => PALETTES[k], theme: k => THEMES[k] };
  function readHash() {
    const h = new URLSearchParams(location.hash.slice(1));
    for (const k of Object.keys(valid)) { const v = h.get(k); if (v && valid[k](v)) state[k] = v; }
  }

  function seg(id, opts, key) {
    const el = document.getElementById(id);
    el.innerHTML = Object.entries(opts).map(([k, l]) => `<button type="button" data-v="${k}" aria-pressed="${state[key] === k}">${l}</button>`).join('');
    el.onclick = e => { const b = e.target.closest('button'); if (!b) return; state[key] = b.dataset.v; renderAll(); };
  }
  const cap = (l, r) => `<div class="fcap"><span>${l}</span><span>${r}</span></div>`;
  const frameD = (dir, t) => `<div>${cap(`${LAYOUTS[dir].name} · ${SCREENS[state.screen].label} · Desktop`, `${PALETTES[state.pal].name} · ${THEMES[t]}`)}
    <div class="frame" data-w="${DW}" data-h="${SCREENS[state.screen].H}" data-device="desktop" data-where="${dir}/${state.screen}"><div class="mock p-${state.pal} t-${t}" style="width:${DW}px;height:${SCREENS[state.screen].H}px">${RENDER[dir][state.screen].d()}</div></div></div>`;
  const frameP = (dir, t) => `<div>${cap(`${LAYOUTS[dir].name} · Phone`, THEMES[t])}
    <div class="frame ph" data-w="${PW}" data-h="${PH}" data-device="phone" data-where="${dir}/${state.screen}"><div class="mock p-${state.pal} t-${t}" style="width:${PW}px;height:${PH}px;background:transparent">${RENDER[dir][state.screen].m()}</div></div></div>`;
  const themesFor = () => state.theme === 'both' ? ['light', 'dark'] : [state.theme];
  function rows(dir) {
    const ts = themesFor();
    if (state.dev === 'mobile') return `<div class="phones">${ts.map(t => frameP(dir, t)).join('')}</div>`;
    return ts.map(t => `<div class="drow${state.dev === 'both' ? ' both' : ''}">${frameD(dir, t)}${state.dev === 'both' ? frameP(dir, t) : ''}</div>`).join('');
  }
  const note = dir => `<p class="note"><b>${LAYOUTS[dir].name} · ${SCREENS[state.screen].label}</b>${(NOTES[dir] || {})[state.screen] || ''}</p>`;
  function swatches(c) {
    const keys = [['app', 'Canvas'], ['surface', 'Surface'], ['line', 'Line'], ['text', 'Text'], ['muted', 'Muted'], ['accent', 'Accent'], ['accentSoft', 'Accent soft'], ['danger', 'Danger']];
    return `<div class="swatches">${keys.map(([k, l]) => `<div class="sw"><i style="background:${c[k]}"></i><b>${l}</b><code>${c[k]}</code></div>`).join('')}</div>`;
  }
  function dirView(k) {
    const d = LAYOUTS[k], p = PALETTES[state.pal];
    return `<div class="dir-intro"><div><h2>${d.name}</h2><div class="tagline">${d.tagline}</div><p>${d.idea}</p>
        <div class="chips-row">${d.inspo.map(x => `<span class="pchip">${x}</span>`).join('')}</div></div>
      <dl class="kv">${AREAS.map((a, i) => `<dt>${a}</dt><dd>${d.d[i] || ''}</dd>`).join('')}</dl></div>
      <div class="frames">${rows(k)}</div><div class="notes one">${note(k)}</div>
      <div class="details">
        <div class="card"><h3>Cost and approach</h3><dl class="spec"><dt>Libraries</dt><dd>${d.libs}</dd><dt>Rework</dt><dd>${d.rework}</dd><dt>Main risk</dt><dd>${d.risk}</dd><dt>Same features</dt><dd>${SAME_FEATURES}</dd></dl></div>
        <div class="card"><h3>Palette: ${p.name}</h3><p class="small">${p.note} Works on every layout.</p>
          <dl class="spec"><dt>Type</dt><dd style="font-family:${p.ui}">${p.fontLabel}</dd><dt>Radius</dt><dd>${p.rsm} / ${p.r} / ${p.rlg}px</dd><dt>Material</dt><dd>${p.material}</dd></dl>
          <div class="sw-theme">Light</div>${swatches(p.light)}<div class="sw-theme">Dark</div>${swatches(p.dark)}</div></div>`;
  }
  function compareView() {
    const ks = Object.keys(LAYOUTS);
    const notes = `<div class="notes">${ks.map(note).join('')}</div>`;
    const head = (k, tag) => `<div class="cmp-h"><div><h3>${LAYOUTS[k].name}</h3>${tag ? `<p>${LAYOUTS[k].tagline}</p>` : ''}</div><button type="button" class="linkbtn" data-open="${k}">Open details</button></div>`;
    if (state.dev === 'desktop') return `<div class="compare">${ks.map(k => `<div class="cmp-cell">${head(k, 1)}<div class="frames">${themesFor().map(t => frameD(k, t)).join('')}</div></div>`).join('')}</div>${notes}`;
    if (state.dev === 'mobile') return `<div class="phones">${ks.map(k => themesFor().map(t => frameP(k, t)).join('')).join('')}</div>${notes}`;
    return `${ks.map(k => `<div class="cmp-row">${head(k)}<div class="frames">${rows(k)}</div></div>`).join('')}${notes}`;
  }
  function staticParts() {
    document.getElementById('eyebrow').textContent = PAGE.eyebrow;
    document.getElementById('title').textContent = PAGE.title;
    document.getElementById('lede').textContent = PAGE.lede;
    document.getElementById('footer').textContent = PAGE.footer;
    document.getElementById('glance-table').innerHTML = `<thead><tr><th>Layout</th>${GLANCE.map(i => `<th>${AREAS[i]}</th>`).join('')}<th>Rework</th><th>Main risk</th></tr></thead>
      <tbody>${Object.values(LAYOUTS).map(d => `<tr><th>${d.name}</th>${GLANCE.map(i => `<td>${d.d[i] || ''}</td>`).join('')}<td>${d.rework}</td><td>${d.risk}</td></tr>`).join('')}</tbody>`;
    document.getElementById('data-lede').textContent = DATA.lede;
    document.getElementById('data-table').innerHTML = `<thead><tr><th>What</th><th>What is stored</th><th>When it is written</th><th>Kept until</th></tr></thead><tbody>${DATA.rows.map(r => `<tr><th style="white-space:normal">${r[0]}</th><td>${r[1]}</td><td>${r[2]}</td><td>${r[3]}</td></tr>`).join('')}</tbody>`;
    document.getElementById('data-cards').innerHTML = `<div class="card"><h3>Survives</h3><ul class="plain">${DATA.stays.map(x => `<li>${x}</li>`).join('')}</ul><p class="small" style="margin-top:10px">${DATA.keys}</p></div><div class="card"><h3>Is lost when</h3><ul class="plain">${DATA.lost.map(x => `<li>${x}</li>`).join('')}</ul></div>`;
    document.getElementById('future-lede').innerHTML = FUTURE.lede;
    document.getElementById('future-cards').innerHTML = Object.keys(LAYOUTS).map(k => `<div class="card${k === 'exam' ? ' pick' : ''}"><h3>${LAYOUTS[k].name}</h3><p class="small">${{ notebook: 'Room at the end of each page and on the hub.', desk: 'Room in the right rail and the sidebar.', exam: 'Room on the dashboard and around the exam. The most room for exam-prep features.' }[k]}</p><ul class="fl">${FUTURE[k].map(([t, d, tag]) => `<li><b><span class="tag">${tag}</span>${t}</b><span>${d}</span></li>`).join('')}</ul></div>`).join('');
    const R = RECOMMENDATION;
    document.getElementById('rec').innerHTML = `<div class="card"><div class="verdict">${R.verdict}</div>${R.why.map(x => `<p>${x}</p>`).join('')}</div>
      <div class="card"><h3>${R.stackTitle}</h3><p class="small">${R.stack}</p><ol>${R.phases.map(x => `<li>${x}</li>`).join('')}</ol><p class="small" style="margin-top:10px">${R.after}</p></div>`;
  }
  function fit() {
    document.querySelectorAll('.frame').forEach(f => {
      const W = +f.dataset.w, H = +f.dataset.h, s = f.clientWidth / W;
      f.style.height = (H * s) + 'px';
      f.firstElementChild.style.transform = `scale(${s})`;
    });
  }
  function renderAll() {
    seg('c-dir', Object.assign(Object.fromEntries(Object.entries(LAYOUTS).map(([k, d]) => [k, d.name])), { compare: 'Side by side' }), 'dir');
    seg('c-dev', DEVICES, 'dev');
    seg('c-pal', Object.fromEntries(Object.entries(PALETTES).map(([k, p]) => [k, p.name])), 'pal');
    seg('c-theme', THEMES, 'theme');
    seg('c-screen', Object.fromEntries(Object.entries(SCREENS).map(([k, s]) => [k, s.label])), 'screen');
    document.getElementById('stage').innerHTML = state.dir === 'compare' ? compareView() : dirView(state.dir);
    try { history.replaceState(null, '', '#' + new URLSearchParams(state)); } catch (e) {}
    if (window.lucide) { try { lucide.createIcons({ icons: lucide.icons }); } catch (e) {} }
    fit();
  }
  document.getElementById('stage').addEventListener('click', e => {
    const b = e.target.closest('[data-open]'); if (!b) return;
    state.dir = b.dataset.open; renderAll(); document.getElementById('stage').scrollIntoView({ block: 'start' });
  });
  window.addEventListener('resize', fit);
  window.addEventListener('hashchange', () => { readHash(); renderAll(); });
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(fit);

  // Used by scripts/render.cjs to list the options and set state synchronously.
  window.DESIGN = { kind: 'directions', layouts: Object.keys(LAYOUTS), screens: Object.keys(SCREENS), palettes: Object.keys(PALETTES) };
  window.setDesignState = partial => { Object.assign(state, partial); renderAll(); };

  readHash();
  staticParts();
  renderAll();
})();
</script>
